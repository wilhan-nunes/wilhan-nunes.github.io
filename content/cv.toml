[summary]
text = """
Research Staff Associate II specializing in computational metabolomics at UC San Diego.
My work spans the creation and curation of microbial metabolite databases, development of
mass spectrometry-based analytical workflows, and web-based tools that bridge experts and
non-experts in the metabolomics field. With over a decade of academic experience across
multiple institutions in Brazil and the US, I bring a track record in both research and teaching.
"""

