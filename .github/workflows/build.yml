name: Build & Deploy CV

on:
  push:
    branches: [main]
  workflow_dispatch:            # allow manual trigger from GitHub UI

permissions:
  contents: write               # needed to commit regenerated static files

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # DOIs added to doi_list.txt by hand get their .bib downloaded here
      - name: Fetch missing .bib files
        run: bash publications/fetch_bibs.sh publications/doi_list.txt

      - name: Build site
        run: python build_site.py

      - name: Build PDF
        run: python build_pdf.py

      - name: Build DOCX (kept in repo, not published)
        run: python build_docx.py

      - name: Commit updated generated files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html research.html experience.html publications.html tools.html cv.html \
                  Wilhan_Nunes_CV.pdf _private publications
          git diff --cached --quiet || git commit -m "chore: rebuild site, pdf and docx [skip ci]"
          git push
